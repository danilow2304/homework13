<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MERN Authentication</title>
    <style>
      body{font-family:system-ui,sans-serif;margin:0;background:#f3f5fb;color:#1c2333}
      nav{display:flex;gap:1rem;align-items:center;padding:.8rem 1.5rem;background:#26324f;color:#fff}
      nav a{color:#fff} nav .spacer{flex:1}
      .container{max-width:720px;margin:1.5rem auto;padding:0 1rem}
      .card{background:#fff;padding:1.25rem;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.12);margin-bottom:1rem}
      label{display:block;margin:.75rem 0 .25rem;font-weight:600}
      input,textarea{width:100%;padding:.5rem;box-sizing:border-box;border:1px solid #b8c0d6;border-radius:4px;font:inherit}
      button{background:#3454d1;color:#fff;border:0;padding:.5rem .9rem;border-radius:4px;cursor:pointer;font-size:.95rem}
      button.danger{background:#b3261e} button.secondary{background:#6b7390}
      .error{color:#b3261e;margin:.25rem 0} .row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
